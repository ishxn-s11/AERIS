# AERIS MQTT broker configuration (Mosquitto 2.x)
# PROTOTYPE NOTE: anonymous access is enabled for local development only.
# Production deployments must enable authentication/TLS and a per-device ACL.

listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener so browser-based tools (and later the frontend) can talk MQTT directly if needed.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
