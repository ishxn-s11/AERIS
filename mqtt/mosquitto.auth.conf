# AERIS MQTT broker configuration — AUTHENTICATED variant.
#
# Use with the compose overlay after generating the credential files:
#
#   python backend/scripts/sync_mqtt_credentials.py --keep-existing
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d mosquitto
#
# Every node authenticates with its own credential and may only publish to its
# own telemetry topic (see mqtt/acl). The backend user reads all telemetry and
# writes the alert topic.

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# No anonymous clients: a node without credentials is rejected at CONNECT.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
